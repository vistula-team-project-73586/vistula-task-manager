
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - 73586</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
    <main class="container">
        <header class="page-header">
            <h1>Task Manager</h1>
            <p>Student ID: <span id="student-id">73586</span></p>
            <p>Organize your tasks and track your progress.</p>
        </header>

        <section class="form-section">
            <h2 id="form-heading">Add a New Task</h2>

            <form id="task-form">
                <label for="task-title">Task title</label>
                <input
                    type="text"
                    id="task-title"
                    placeholder="Enter task title"
                    required
                >

                <label for="task-description">Description</label>
                <textarea
                    id="task-description"
                    placeholder="Enter task description"
                    rows="3"
                ></textarea>

                <div class="form-buttons">
                    <button type="submit" id="task-submit">
                        Add Task
                    </button>

                    <button type="button" id="cancel-edit" hidden>
                        Cancel
                    </button>
                </div>
            </form>
        </section>

        <section class="tasks-section">
            <h2>Your Tasks</h2>
            <div id="task-list">
                <p>Loading tasks...</p>
            </div>
        </section>

        <p id="status-message" role="status" aria-live="polite"></p>

        <footer>
            <a id="contribution-link" href="contribution.html">
                Team Contribution
            </a>
        </footer>
    </main>
</body>
</html>
